{% extends "base.html" %}

{% block title %}Edit expense — Spendly{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit expense</h1>
            <p class="auth-subtitle">Update what you spent</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense['id']) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="e.g. 250.00"
                           step="0.01" min="0.01" required autofocus
                           value="{{ form_amount or '' }}">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled
                            {% if not form_category %}selected{% endif %}>
                            Select a category…
                        </option>
                        {% for cat in categories %}
                        <option value="{{ cat }}"
                            {% if form_category == cat %}selected{% endif %}>
                            {{ cat }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" required
                           value="{{ form_date or '' }}">
                </div>

                <div class="form-group">
                    <label for="description">Description
                        <span class="optional-hint">(optional)</span>
                    </label>
                    <textarea id="description" name="description"
                              class="form-input form-textarea"
                              placeholder="What was this for?"
                              rows="3">{{ form_description or '' }}</textarea>
                </div>

                <button type="submit" class="btn-submit">Save changes</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Cancel</a>
        </p>

    </div>
</section>

{% endblock %}
